name: Canonical Metals Test Build Publish
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [master, work/technical-signal-education]
    paths:
      - "metals/**"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "requirements-canonical.txt"
      - "index.html"
      - ".github/workflows/canonical-metals.yml"
  pull_request:
    branches: [master]
permissions:
  contents: write
concurrency:
  group: canonical-metals-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-canonical.txt
      - name: Install engine and browser dependencies
        run: |
          pip install -r requirements-canonical.txt
          pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Regression and causal timing tests
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Fetch one snapshot and evaluate both metals
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m metals.pipeline --raw .snapshot --stage .stage --history data
      - name: Build isolated site
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp -R assets site/assets
          cp -R .stage/. site/data/
          touch site/.nojekyll
      - name: Exercise gold silver modes and timeframes
        run: |
          python -m http.server 8000 --directory site > /tmp/metals-http.log 2>&1 &
          python scripts/check_dashboard.py
      - name: Persist coherent bundle after all checks
        if: github.event_name != 'pull_request'
        env:
          METALS_BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$METALS_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$METALS_BRANCH")"
          cp -R .stage/. data/
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/validation data/setup_ledger.json data/signal_ledger.json data/forward_ledger_v2.json data/run_manifest.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish coherent causal metals snapshot"
            git push origin "HEAD:$METALS_BRANCH"
          fi
      - name: Verify existing live Pages site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          METALS_RUN_ID=$(python -c "import json; print(json.load(open('data/dashboard.json'))['run_id'])")
          python scripts/check_dashboard.py --url https://samin110597-create.github.io/Gold-Price-Prediction-LSTM/ --expected-run "$METALS_RUN_ID" --wait 900
      - name: Preserve test evidence source snapshot and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-evidence-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 30
          path: |
            test-results.xml
            screenshots/
            .snapshot/
            .stage/
