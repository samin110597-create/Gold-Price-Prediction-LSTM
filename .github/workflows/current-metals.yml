name: Fast Metals Quotes and Technicals
on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"
  push:
    branches: [master]
    paths: [".github/workflows/current-metals.yml"]
permissions:
  contents: write
concurrency:
  group: metals-publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  current-market:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-canonical.txt
      - run: pip install -r requirements-canonical.txt
      - name: Refresh current market without fitting models
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB_KEY || secrets.FINHUB_API_KEY || secrets.FINNHUB_TOKEN || secrets.FINNHUB }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY || secrets.FMP_KEY || secrets.FINANCIAL_MODELING_PREP_API_KEY || secrets.FMP }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_KEY || secrets.FRED }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_KEY || secrets.MASSIVE_API_KEY || secrets.POLYGON }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY || secrets.ALPHAVANTAGE_KEY || secrets.ALPHA_VANTAGE }}
        run: python -m metals.live
      - name: Publish current observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh timestamped metals quotes and technicals"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
