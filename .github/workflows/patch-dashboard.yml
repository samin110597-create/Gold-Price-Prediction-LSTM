name: Patch V4 Dashboard

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "dashboard_v4_patch.py"
      - "dashboard_numbers_patch.py"
      - "dashboard_chart_patch.py"
      - "dashboard_chart_fallback_patch.py"
      - "dashboard_measured_move_patch.py"
      - "technical_overlay_enrich.py"
      - "measured_move_enrich.py"
      - "technical_signal_audit.py"
      - "repair_dashboard_header.py"
      - "requirements-live.txt"
      - ".github/workflows/patch-dashboard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-live.txt
      - name: Install dependencies
        run: pip install -r requirements-live.txt
      - name: Refresh advanced chart patterns divergences and signal markers
        run: python technical_overlay_enrich.py
      - name: Fill measured moves and structure objectives
        run: python measured_move_enrich.py
      - name: Refresh fixed-rule signal event audit
        run: python technical_signal_audit.py
      - name: Patch dashboard
        run: python dashboard_v4_patch.py
      - name: Add hard numbers and direction panel
        run: python dashboard_numbers_patch.py
      - name: Add advanced technical chart overlays
        run: python dashboard_chart_patch.py
      - name: Add client-side overlay fallback
        run: python dashboard_chart_fallback_patch.py
      - name: Show measured move values and target basis
        run: python dashboard_measured_move_patch.py
      - name: Clean header and keep patch idempotent
        run: python repair_dashboard_header.py
      - name: Commit dashboard and technical overlay data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/gold_technicals.json data/silver_technicals.json dashboard_v4_patch.py dashboard_numbers_patch.py dashboard_chart_patch.py dashboard_chart_fallback_patch.py dashboard_measured_move_patch.py measured_move_enrich.py
          if git diff --cached --quiet; then
            echo "Dashboard and technical overlays already current"
          else
            git commit -m "Fill measured moves on technical patterns"
            git fetch origin master
            git rebase origin/master
            git push origin master
          fi
