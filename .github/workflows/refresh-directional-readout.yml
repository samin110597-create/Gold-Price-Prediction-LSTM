name: Refresh Directional Readout

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "precision_gate_v7.py"
      - "dashboard_precision_gate_patch.py"
      - ".github/workflows/refresh-directional-readout.yml"

permissions:
  contents: write

concurrency:
  group: directional-readout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build always-visible directional readout
        run: python precision_gate_v7.py
      - name: Patch directional readout dashboard
        run: python dashboard_precision_gate_patch.py
      - name: Commit directional readout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/gold_precision_gate_v7.json data/silver_precision_gate_v7.json
          if git diff --cached --quiet; then
            echo "Directional readout already current"
          else
            git commit -m "Refresh always-visible directional readout"
            git fetch origin master
            git rebase origin/master
            git push origin master
          fi
