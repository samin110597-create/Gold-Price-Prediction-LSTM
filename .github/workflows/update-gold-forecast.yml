name: Update Gold Forecast

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "live_forecast.py"
      - "requirements-live.txt"
      - ".github/workflows/update-gold-forecast.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Install dependencies
        run: pip install -r requirements-live.txt

      - name: Build latest forecast
        run: python live_forecast.py

      - name: Commit updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_forecast.json
          if git diff --cached --quiet; then
            echo "No forecast changes to commit"
          else
            git commit -m "Update gold forecast data"
            git push
          fi
