name: Update Metals Intelligence

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "multi_asset_forecast_v2.py"
      - "technical_analysis.py"
      - "technical_frameworks_enrich.py"
      - "technical_selective_model.py"
      - "technical_selective_runner.py"
      - "projection_model_v2.py"
      - "macro_1y_model.py"
      - "macro_1y_runner.py"
      - "regime_intraday_model.py"
      - "regime_intraday_runner.py"
      - "projection_focus.py"
      - "backtest_engine.py"
      - "enhance_guru_summary.py"
      - "requirements-live.txt"
      - ".github/workflows/update-gold-forecast.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Install dependencies
        run: pip install -r requirements-live.txt

      - name: Build walk-forward probability forecasts
        run: python multi_asset_forecast_v2.py

      - name: Build full technical analysis
        run: python technical_analysis.py

      - name: Add support resistance Elliott Wyckoff and deep Fibonacci
        run: python technical_frameworks_enrich.py

      - name: Build nested selective technical prediction challengers
        run: python technical_selective_runner.py

      - name: Build champion walk-forward 4H 1D 1W 1Y projections
        run: python projection_model_v2.py

      - name: Build dedicated macro 1Y challenger and promote only if stronger
        run: python macro_1y_runner.py

      - name: Compare 4H regime model independently
        run: python regime_intraday_runner.py

      - name: Build tighter validation-weighted focus zones
        run: python projection_focus.py

      - name: Audit champion and challenger models
        run: python backtest_engine.py

      - name: Compose institutional market guru summary
        run: python enhance_guru_summary.py

      - name: Commit updated intelligence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_forecast.json data/silver_forecast.json data/gold_technicals.json data/silver_technicals.json data/gold_technical_model.json data/silver_technical_model.json data/gold_projections.json data/silver_projections.json data/gold_macro_1y.json data/silver_macro_1y.json data/gold_regime_intraday.json data/silver_regime_intraday.json data/model_backtest.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit"
          else
            git commit -m "Update champion challenger metals intelligence data"
            git push
          fi
