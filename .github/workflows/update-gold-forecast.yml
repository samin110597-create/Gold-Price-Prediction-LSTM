name: Update Metals Intelligence

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "multi_asset_forecast.py"
      - "requirements-live.txt"
      - ".github/workflows/update-gold-forecast.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-live.txt

      - name: Install dependencies
        run: pip install -r requirements-live.txt

      - name: Build gold and silver forecasts
        run: python multi_asset_forecast.py

      - name: Commit updated intelligence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_forecast.json data/silver_forecast.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit"
          else
            git commit -m "Update gold and silver intelligence data"
            git push
          fi
