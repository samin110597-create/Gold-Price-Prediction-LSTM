<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Metals Intelligence | Gold & Silver</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#071018;--panel:#101a25;--panel2:#0c1621;--line:#26384b;--text:#eef4fa;--muted:#91a4b8;--gold:#d9b55f;--silver:#c8d1db;--green:#5bd39a;--red:#ff7d86;--blue:#72a8ff;--amber:#efbe68}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#14243a 0,#09121b 42%,#060c12 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1260px;margin:auto;padding:24px 18px 55px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(30px,5vw,52px);line-height:1.03;margin:7px 0}.sub{max-width:800px;color:var(--muted);line-height:1.58}.badge{border:1px solid #34495e;border-radius:999px;padding:8px 12px;color:#cbd6e2;background:#0d1722;font-size:12px}.tabs{display:flex;gap:8px;margin:21px 0 14px}.tab{border:1px solid #33495f;background:#0d1823;color:#c9d5e1;padding:10px 17px;border-radius:11px;font-weight:850;cursor:pointer}.tab.active{background:#1a2635;color:#fff}.tab.gold.active{box-shadow:inset 0 -2px 0 var(--gold)}.tab.silver.active{box-shadow:inset 0 -2px 0 var(--silver)}.card{background:rgba(16,26,37,.96);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 15px 34px rgba(0,0,0,.18)}.label{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:10px}.value{font-weight:850;font-size:26px;margin-top:7px}.small{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.good{color:var(--green)}.bad{color:var(--red)}.neutral{color:#d7dee6}.guru{display:grid;grid-template-columns:220px 1fr;gap:13px;margin-bottom:13px}.guru-main{display:flex;flex-direction:column;justify-content:center}.guru-bias{font-size:34px;font-weight:900;margin:5px 0}.guru-lines{display:grid;grid-template-columns:1fr 1fr;gap:9px}.guru-line{background:var(--panel2);border:1px solid #27394b;border-radius:11px;padding:11px}.guru-line b{display:block;font-size:11px;color:#e4edf5;margin-bottom:5px}.guru-line span{font-size:13px;line-height:1.45;color:#afbdca}.section-title{font-size:19px;font-weight:900;margin:22px 0 10px}.section-kicker{font-size:11px;color:var(--muted);font-weight:700;margin-left:7px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:12px}.projections{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:12px}.projection .price{font-size:27px;font-weight:900;margin:7px 0}.projection .ret{font-weight:800;font-size:13px}.zone{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.zone b{display:block;font-size:14px;margin-top:3px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-bottom:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.chart-title{font-size:17px;font-weight:850}.tech-score{font-size:38px;font-weight:900;margin:5px 0}.tech-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.pill{background:var(--panel2);border:1px solid #27394b;border-radius:11px;padding:10px}.pill .v{font-size:15px;font-weight:850;margin-top:4px}.signals{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.signal{background:var(--panel2);border:1px solid #27394b;border-radius:10px;padding:9px}.signal b{font-size:12px}.signal div{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.forecasts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px}.forecast .prob{font-size:29px;font-weight:900;margin:7px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.metric span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.metric b{display:block;margin-top:3px;font-size:13px}.factors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.factor{background:var(--panel2);border:1px solid #27394b;border-radius:11px;padding:10px}.factor-head{display:flex;justify-content:space-between;gap:8px}.factor strong{font-size:12px}.factor p{font-size:11px;color:var(--muted);line-height:1.35;margin:7px 0 0}.note{color:#b8c6d4;font-size:13px;line-height:1.6}.status{margin-top:10px;font-size:12px;color:var(--muted)}@media(max-width:980px){.projections,.grid4{grid-template-columns:repeat(2,1fr)}.guru,.two{grid-template-columns:1fr}.three,.forecasts,.factors{grid-template-columns:1fr}.tech-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.projections,.grid4,.guru-lines,.tech-grid,.signals,.levels{grid-template-columns:1fr}.wrap{padding-top:17px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="eyebrow">Multi-asset research terminal</div><h1>Metals Intelligence</h1><div class="sub">Gold and Silver market intelligence combining model projections, full chart technicals, cross-market factors, and conservative statistical probability forecasts.</div></div><div class="badge" id="updated">Loading latest run…</div></div>
<div class="tabs"><button class="tab gold active" data-asset="gold">Gold Intelligence</button><button class="tab silver" data-asset="silver">Silver Intelligence</button></div>
<div id="app"><div class="card">Loading market intelligence…</div></div>
</main>
<script>
let active='gold',chart; const $=s=>document.querySelector(s); const money=n=>'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); const pct=n=>(Number(n)*100).toFixed(1)+'%'; const signed=n=>(Number(n)>=0?'+':'')+Number(n).toFixed(2)+'%';
const toneText=t=>/Bull|Support|Uptrend|Risk-on|Confirm|Improving/.test(t)?'good':(/Bear|Headwind|Downtrend|Risk-off|Diverg|Fading/.test(t)?'bad':'neutral');
function guru(d){let g=d.guru_summary||{};return `<section class="guru"><div class="card guru-main"><div class="label">Market Guru Summary</div><div class="guru-bias ${toneText(g.bias||'')}">${g.bias||d.regime?.overall||'—'}</div><div class="small">Conviction: <b>${g.conviction||'—'}</b> • Regime: ${g.regime||'—'}</div></div><div class="card guru-lines"><div class="guru-line"><b>WHAT THE MARKET IS SAYING</b><span>${g.model_view||'—'}</span></div><div class="guru-line"><b>KEY TRIGGER</b><span>${g.trigger||'—'}</span></div><div class="guru-line"><b>RISK TO THE VIEW</b><span>${g.risk||'—'}</span></div><div class="guru-line"><b>SMART READ</b><span>${d.regime?.trend||'—'} • Macro ${d.regime?.macro||'—'} • Volatility ${d.regime?.volatility||'—'}</span></div></div></section>`}
function projections(p){return `<div class="section-title">Model Price Projection <span class="section-kicker">4H • 1D • 1W • 1Y</span></div><section class="projections">${p.projections.map(x=>`<div class="card projection"><div class="label">${x.horizon}</div><div class="price">${money(x.model_price)}</div><div class="ret ${x.projected_return_pct>=0?'good':'bad'}">${signed(x.projected_return_pct)} projected</div><div class="small">Up probability ${pct(x.probability_up)} • ${x.confidence} confidence</div><div class="zone"><div class="label">Tight model zone</div><b>${money(x.tight_model_zone[0])} – ${money(x.tight_model_zone[1])}</b><div class="small">Directional backtest ${pct(x.backtest_directional_accuracy)} • agreement ${pct(x.model_agreement)}</div></div></div>`).join('')}</section><div class="note">${p.note}</div>`}
function tech(t){let i=t.indicators||{},z=t.technical_path_zones||{},c=t.confirmation||{},pv=t.pivots||{};return `<div class="section-title">Full Technical Analysis <span class="section-kicker">chart-driven confluence</span></div><section class="two"><div class="card"><div class="chart-head"><div><div class="chart-title">Price Structure + EMA + Bollinger</div><div class="small">Latest 180 daily bars</div></div><div class="badge">${t.market_structure}</div></div><canvas id="techChart" height="105"></canvas></div><div class="card"><div class="label">Technical Confluence Score</div><div class="tech-score ${toneText(t.technical_bias)}">${t.technical_score}/100</div><div class="value ${toneText(t.technical_bias)}" style="font-size:19px">${t.technical_bias}</div><div class="small">Candlestick: ${t.candlestick}</div><div class="tech-grid"><div class="pill"><div class="label">RSI 14</div><div class="v">${i.rsi14}</div></div><div class="pill"><div class="label">MACD Hist</div><div class="v">${i.macd_hist}</div></div><div class="pill"><div class="label">ADX 14</div><div class="v">${i.adx14}</div></div><div class="pill"><div class="label">Stochastic</div><div class="v">${i.stoch_k}/${i.stoch_d}</div></div></div><div class="zone"><div class="label">Tighter technical path</div><b>1–3D: ${money(z['1_3d']?.[0])} – ${money(z['1_3d']?.[1])}</b><b>5–10D: ${money(z['5_10d']?.[0])} – ${money(z['5_10d']?.[1])}</b></div></div></section><section class="two"><div class="card"><div class="chart-title">Signal Stack</div><div class="signals">${t.signals.map(s=>`<div class="signal"><b>${s.name}: <span class="${toneText(s.state)}">${s.state}</span></b><div>${s.detail}</div></div>`).join('')}</div></div><div class="card"><div class="chart-title">Levels & Confirmation</div><div class="levels"><div class="pill"><div class="label">Bullish confirmation</div><div class="v good">Above ${money(c.bullish_above)}</div></div><div class="pill"><div class="label">Bearish confirmation</div><div class="v bad">Below ${money(c.bearish_below)}</div></div><div class="pill"><div class="label">Pivot / R1</div><div class="v">${money(pv.pivot)} / ${money(pv.r1)}</div></div><div class="pill"><div class="label">Pivot / S1</div><div class="v">${money(pv.pivot)} / ${money(pv.s1)}</div></div><div class="pill"><div class="label">BB Upper / Lower</div><div class="v">${money(i.bb_upper)} / ${money(i.bb_lower)}</div></div><div class="pill"><div class="label">20D VWAP</div><div class="v">${i.rolling_vwap20?money(i.rolling_vwap20):'—'}</div></div></div><p class="note">${(t.narrative||[]).join(' ')}</p></div></section>`}
function stats(d){return `<div class="section-title">Statistical Probability & Risk <span class="section-kicker">keep this as the safety envelope</span></div><section class="forecasts">${d.forecasts.map(f=>`<div class="card forecast"><div class="label">${f.horizon_days} trading day${f.horizon_days>1?'s':''}</div><div class="prob ${f.probability_up>=.56?'good':f.probability_up<=.44?'bad':'neutral'}">${pct(f.probability_up)} UP</div><div class="small">${f.signal} • ${f.confidence} confidence</div><div class="metrics"><div class="metric"><span>Statistical center</span><b>${money(f.forecast_mid)}</b></div><div class="metric"><span>Risk envelope</span><b>${money(f.range_20_80[0])} – ${money(f.range_20_80[1])}</b></div><div class="metric"><span>Backtest</span><b>${pct(f.backtest_accuracy)}</b></div><div class="metric"><span>Model agreement</span><b>${pct(f.model_agreement)}</b></div></div></div>`).join('')}</section>`}
function factors(d){return `<section class="two"><div class="card"><div class="chart-title">Cross-Market Factor Board</div><div class="factors">${(d.factors||[]).map(f=>`<div class="factor"><div class="factor-head"><strong>${f.name}</strong><span class="${toneText(f.impact)}">${f.impact}</span></div><div class="small">5D ${signed(f.change_5d_pct)} • 20D ${signed(f.change_20d_pct)}</div><p>${f.reason}</p></div>`).join('')}</div></div><div class="card"><div class="chart-title">Current Market State</div><div class="grid4" style="grid-template-columns:1fr 1fr;margin-top:10px"><div class="pill"><div class="label">Latest</div><div class="v">${money(d.latest_price)}</div></div><div class="pill"><div class="label">Change</div><div class="v ${d.change_pct>=0?'good':'bad'}">${signed(d.change_pct)}</div></div><div class="pill"><div class="label">Trend</div><div class="v">${d.regime.trend}</div></div><div class="pill"><div class="label">Macro</div><div class="v">${d.regime.macro}</div></div></div><p class="note">Research/education only. Model prices and technical targets are estimates, not guaranteed future prices.</p></div></section>`}
function draw(t){if(chart)chart.destroy();let x=t.chart||[];chart=new Chart(document.getElementById('techChart'),{type:'line',data:{labels:x.map(r=>r.date),datasets:[{label:'Price',data:x.map(r=>r.close),borderColor:'#d9b55f',borderWidth:2,pointRadius:0,tension:.12},{label:'EMA20',data:x.map(r=>r.ema20),borderColor:'#72a8ff',borderWidth:1.4,pointRadius:0},{label:'EMA50',data:x.map(r=>r.ema50),borderColor:'#c8d1db',borderWidth:1.2,pointRadius:0},{label:'BB Upper',data:x.map(r=>r.bb_upper),borderColor:'rgba(160,180,200,.45)',borderDash:[5,5],borderWidth:1,pointRadius:0},{label:'BB Lower',data:x.map(r=>r.bb_lower),borderColor:'rgba(160,180,200,.45)',borderDash:[5,5],borderWidth:1,pointRadius:0}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#aebdcc'}}},scales:{x:{grid:{display:false},ticks:{color:'#8193a7',maxTicksLimit:8}},y:{grid:{color:'rgba(130,150,175,.10)'},ticks:{color:'#8193a7',callback:v=>'$'+Number(v).toLocaleString()}}}}})}
async function load(asset){active=asset;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.asset===asset));let files=asset==='gold'?['data/live_forecast.json','data/gold_technicals.json','data/gold_projections.json']:['data/silver_forecast.json','data/silver_technicals.json','data/silver_projections.json'];try{let [d,t,p]=await Promise.all(files.map(u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' not ready');return r.json()})));$('#updated').textContent='Updated '+new Date(d.updated_utc).toLocaleString();$('#app').innerHTML=guru(d)+projections(p)+tech(t)+stats(d)+factors(d);draw(t)}catch(e){$('#app').innerHTML=`<div class="card"><div class="chart-title">Latest automated run is still building</div><p class="note">${e.message}. Open GitHub → Actions → Update Metals Intelligence if you want to run it manually once.</p></div>`}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>load(b.dataset.asset));load('gold');setInterval(()=>load(active),5*60*1000);
</script></body></html>
