<style>

two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-bottom:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px}.priority-panel{display:grid;grid-template-columns:240px 1fr;gap:12px;margin-bottom:13px}.quality-number{font-size:42px;font-weight:950;margin:5px 0}.quality-bar{height:9px;border-radius:99px;background:#182635;overflow:hidden;margin-top:9px}.quality-fill{height:100%;background:var(--blue)}.plain-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.plain-box,.pill{background:var(--panel2);border:1px solid #2b3c50;border-radius:11px;padding:11px}.plain-box b{display:block;font-size:12px;margin-bottom:5px}.plain-box span,.pill .small{font-size:12px;line-height:1.45;color:#afbdca}.pill .v{font-size:15px;font-weight:850;margin-top:4px}.target-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.target-card{background:#0b1720;border:1px solid #2b3c50;border-radius:12px;padding:12px}.target-card.priority{border-color:rgba(91,211,154,.45)}.target-price{font-size:27px;font-weight:900;margin:5px 0}.priority-tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.05em;background:rgba(91,211,154,.1);color:var(--green);border:1px solid rgba(91,211,154,.35)}.pred-grid,.projections{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:12px}.projection .price,.pred-card .price{font-size:28px;font-weight:900;margin:7px 0}.projection-status{display:flex;justify-content:space-between;align-items:center;gap:8px}.pass-pill{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:850;font-size:10px;border:1px solid #33495f}.pass-pill.pass{color:var(--green);border-color:rgba(91,211,154,.4)}.pass-pill.fail{color:var(--amber);border-color:rgba(239,190,104,.4)}.zone{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.zone b{display:block;font-size:13px;margin-top:3px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.chart-title{font-size:17px;font-weight:850}.tech-score{font-size:38px;font-weight:900;margin:5px 0}.tech-grid,.levels,.signals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.signal{background:var(--panel2);border:1px solid #27394b;border-radius:10px;padding:9px}.signal b{font-size:12px}.signal div{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}.desk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.technical-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.technical-table td{padding:7px 4px;border-bottom:1px solid rgba(38,56,75,.65)}.technical-table td:last-child{text-align:right;font-weight:800}.pattern-grid,.tf-grid,.factors,.zone-grid,.framework-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pattern-grid{grid-template-columns:repeat(2,1fr)}.pattern-card,.tf-card,.factor,.zone-card,.framework-card{background:var(--panel2);border:1px solid #27394b;border-radius:10px;padding:10px}.pattern-card p,.factor p,.framework-card p{font-size:11px;color:var(--muted);line-height:1.4;margin:5px 0 0}.tf-card .tf-trend{font-size:16px;font-weight:900;margin:5px 0}.factor-head{display:flex;justify-content:space-between;gap:8px}.zone-card .zprice{font-size:18px;font-weight:900;margin:5px 0}.framework-card .big{font-size:18px;font-weight:900;margin:5px 0}.wave-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.wave{border:1px solid #33495f;border-radius:8px;padding:6px 8px;font-size:10px;background:#0a141f}.tv-wrap{height:540px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b1520}.tv-host{height:100%;width:100%}.forecasts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:12px}.forecast .prob{font-size:29px;font-weight:900;margin:7px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.metric span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.metric b{display:block;margin-top:3px;font-size:13px}.note{color:#b8c6d4;font-size:13px;line-height:1.6}.audit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.audit-table{width:100%;border-collapse:collapse;font-size:12px}.audit-table th,.audit-table td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}.audit-table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.cheat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.cheat-item{background:var(--panel2);border:1px solid #2b3c50;border-radius:11px;padding:11px}.cheat-item b{display:block;font-size:12px;margin-bottom:5px}.cheat-item span{font-size:11px;color:var(--muted);line-height:1.4}@media(max-width:980px){.pred-grid,.projections,.grid4{grid-template-columns:repeat(2,1fr)}.two,.audit-grid,.priority-panel,.desk-grid,.plain-summary,.target-grid,.framework-grid{grid-template-columns:1fr}.forecasts,.factors,.cheat-grid,.zone-grid{grid-template-columns:1fr}.tf-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.pred-grid,.projections,.grid4,.tech-grid,.signals,.levels,.tf-grid,.pattern-grid{grid-template-columns:1fr}.wrap{padding-top:17px}.audit-table{font-size:10px}.tv-wrap{height:440px}}

.v4-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:11px;margin-bottom:12px}.v4-card{background:rgba(16,26,37,.96);border:1px solid #2f4862;border-radius:16px;padding:16px}.v4-card.hero{border-color:rgba(114,168,255,.55)}.v4-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.v4-table td{padding:6px 3px;border-bottom:1px solid rgba(38,56,75,.65)}.v4-table td:last-child{text-align:right}.v4-probs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.v4-prob{background:#0c1621;border:1px solid #27394b;border-radius:9px;padding:8px;font-size:11px}@media(max-width:980px){.v4-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.v4-grid,.v4-probs{grid-template-columns:1fr}}

/* HARD_NUMBERS_PANEL */
.hn-wrap{margin-bottom:12px}.hn-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:rgba(16,26,37,.96)}.hn-table{width:100%;min-width:1080px;border-collapse:collapse;font-size:11px}.hn-table th,.hn-table td{padding:9px 8px;border-bottom:1px solid rgba(38,56,75,.7);text-align:right;white-space:nowrap}.hn-table th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#0c1621;position:sticky;top:0}.hn-table th:first-child,.hn-table td:first-child{text-align:left}.hn-dir{font-weight:900}.hn-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.hn-card{background:rgba(16,26,37,.96);border:1px solid var(--line);border-radius:14px;padding:13px}.hn-card .big{font-size:22px;font-weight:900;margin:4px 0}.hn-kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.hn-kpi{background:#0c1621;border:1px solid #27394b;border-radius:9px;padding:7px}.hn-kpi span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.hn-kpi b{display:block;margin-top:3px;font-size:12px}.hn-mini{width:100%;border-collapse:collapse;font-size:10px;margin-top:7px}.hn-mini td{padding:5px 2px;border-bottom:1px solid rgba(38,56,75,.55)}.hn-mini td:last-child{text-align:right;font-weight:800}.hn-chip{display:inline-block;border:1px solid #33495f;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:850;margin:2px 3px 2px 0}.hn-read{font-size:13px;line-height:1.55;color:#c7d4df;margin-top:8px}@media(max-width:980px){.hn-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.hn-cards{grid-template-columns:1fr}}

/* ADVANCED_TECH_CHART */
.overlay-legend{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.overlay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.overlay-pattern{background:#0c1621;border:1px solid #27394b;border-radius:10px;padding:9px}.overlay-pattern .head{display:flex;justify-content:space-between;gap:8px;align-items:center}.overlay-pattern b{font-size:12px}.overlay-pattern .meta{font-size:10px;color:var(--muted);margin-top:4px}.overlay-pattern .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.overlay-pattern .levels span{font-size:9px;background:#09131d;border:1px solid #223547;border-radius:7px;padding:5px}.signal-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.signal-chip{font-size:9px;border:1px solid #33495f;border-radius:999px;padding:4px 7px;background:#0c1621}.overlay-note{font-size:10px;color:var(--muted);line-height:1.45;margin-top:7px}@media(max-width:700px){.overlay-grid{grid-template-columns:1fr}.overlay-pattern .levels{grid-template-columns:1fr}}

<body><main class="wrap"><div class="top"><div><div class="eyebrow">Gold • Silver</div><h1>Metals Intelligence</h1><div class="sub">Forecasts, technicals and model audit.</div></div><div class="badge" id="updated">Loading latest run…</div></div><div class="tabs"><button class="tab gold active" data-view="gold">Gold Intelligence</button><button class="tab silver" data-view="silver">Silver Intelligence</button><button class="tab audit" data-view="audit">Model Audit</button></div><div id="app"><div class="card">Loading market intelligence…</div></div></main>
<script>
let active='gold',chart;const $=s=>document.querySelector(s);const money=n=>Number.isFinite(Number(n))?'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—';const pct=n=>Number.isFinite(Number(n))?(Number(n)*100).toFixed(1)+'%':'—';const signed=n=>Number.isFinite(Number(n))?(Number(n)>=0?'+':'')+Number(n).toFixed(2)+'%':'—';const toneText=t=>/Bull|Support|Uptrend|Risk-on|Confirm|Improving|PASS|Validated|Markup|Accumulation/i.test(String(t))?'good':(/Bear|Headwind|Downtrend|Risk-off|Diverg|Fading|Markdown|Distribution/i.test(String(t))?'bad':'neutral');
function modelQuality(a){if(!a)return {score:0,label:'Not ready',tone:'neutral',message:'Audit data is not ready yet.'};const price=a.price_projections||[],probs=a.probability_forecasts||[],tech=a.technical_champions||a.technical_signals||[];const avg=x=>x.length?x.reduce((s,v)=>s+v,0)/x.length:0;const passRate=Number(a.component_pass_rate||0),dir=avg(price.map(x=>Math.max(-.15,Math.min(.15,Number(x.directional_edge||0))))),mae=avg(price.map(x=>Math.max(-.15,Math.min(.15,Number(x.mae_skill_vs_baseline||0))))),pe=avg(probs.map(x=>Math.max(-.15,Math.min(.15,Number(x.edge||0))))),te=avg(tech.map(x=>Math.max(-.15,Math.min(.15,Number(x.edge||0))))),origins=price.reduce((s,x)=>s+Number(x.walkforward_origins||0),0);let score=20+passRate*45+(dir+mae+pe+te)*110+Math.min(10,origins/20);score=Math.max(5,Math.min(95,Math.round(score)));const label=score>=75?'Strong':score>=60?'Good':score>=45?'Mixed':score>=30?'Weak':'Very weak',tone=score>=60?'good':score<40?'bad':'amber';return {score,label,tone,message:score>=60?'Several tested parts show useful edge.':score>=45?'Some useful evidence exists, but it is not consistent yet.':'Overall model quality is weak; treat non-validated forecasts cautiously.'}}
function rankedProjection(p,a){if(!p?.projections?.length)return null;const amap=Object.fromEntries((a?.price_projections||[]).map(x=>[x.horizon,x]));const rows=p.projections.map(proj=>({proj,a:amap[proj.horizon]}));rows.forEach(x=>{const passed=x.a?.pass?1:0,skill=Number(x.proj.mae_skill_vs_baseline??x.a?.mae_skill_vs_baseline??0),edge=Number(x.proj.directional_edge??x.a?.directional_edge??0),conf=Number(x.proj.confidence_score||35)/100,trust=Number(x.proj.ml_trust??.25);x.rank=passed*2+Math.max(-.2,edge)*1.4+Math.max(-.2,skill)*1.2+conf*.3+trust*.2});rows.sort((x,y)=>y.rank-x.rank);return rows[0]}
function forecastState(x,a){return a?.pass?{label:'PASS',cls:'pass'}:{label:'FAIL',cls:'fail'}}
function simpleGuru(d,t,p,a,r){const q=modelQuality(a),best=rankedProjection(p,a),bull=t?.confirmation?.bullish_above,bear=t?.confirmation?.bearish_below,tech=Number(t?.technical_score),regime=r?.current_regime||d?.regime?.volatility||'Mixed';const passed=(a?.price_projections||[]).filter(x=>x.pass).map(x=>x.horizon);const matters=`Chart: ${String(t?.technical_bias||'mixed').toLowerCase()}${Number.isFinite(tech)?` (${tech.toFixed(0)}/100)`:''}. Market type: ${regime}.`;const passedText=passed.length?`Passed price horizons: ${passed.join(', ')}.`:'No price horizon currently passes the full audit. Failed forecasts stay visible with probability only.';const changeText=(bull!=null&&bear!=null)?`Above ${money(bull)} strengthens the higher-price case. Below ${money(bear)} strengthens the lower-price case. Between them, conviction is lower.`:'Confirmation levels are not ready.';let base='—',sub='No model forecast available',up='—',down='—',tone='neutral';if(best){const x=best.proj,pp=Number(x.predicted_price??x.model_price),fz=x.focus_zone||x.tight_model_zone||[pp,pp];base=money(pp);sub=`${x.horizon} • ${forecastState(x,best.a).label} • UP ${pct(x.probability_up)} / DOWN ${pct(x.probability_down)}`;tone=pp>=Number(d.latest_price)?'good':'bad';up=money(fz[1]);down=money(fz[0])}return `<div class="section-title">Market Guru Summary <span class="section-kicker">what matters • what passed • what could change</span></div><section class="priority-panel"><div class="card"><div class="label">Model Quality</div><div class="quality-number ${q.tone}">${q.score}/100</div><div class="value" style="font-size:18px">${q.label}</div><div class="quality-bar"><div class="quality-fill" style="width:${q.score}%"></div></div><div class="small">${q.message}</div></div><div class="card"><div class="plain-summary"><div class="plain-box"><b>WHAT MATTERS</b><span>${matters}</span></div><div class="plain-box"><b>WHAT PASSED</b><span>${passedText}</span></div><div class="plain-box"><b>WHAT COULD CHANGE</b><span>${changeText}</span></div></div><div class="target-grid"><div class="target-card priority"><span class="priority-tag">HIGHEST PRIORITY</span><div class="target-price ${tone}">${base}</div><div class="small">${sub}</div></div><div class="target-card"><div class="label">Higher focus</div><div class="target-price good">${up}</div><div class="small">Needs bullish confirmation first.</div></div><div class="target-card"><div class="label">Lower focus</div><div class="target-price bad">${down}</div><div class="small">Needs bearish confirmation first.</div></div></div></div></section>`}
function predictionSnapshot(p,a){const amap=Object.fromEntries((a?.price_projections||[]).map(x=>[x.horizon,x]));return `<div class="section-title">Price Prediction Snapshot <span class="section-kicker">point price • probability • backtest PASS/FAIL</span></div><section class="pred-grid">${(p.projections||[]).map(x=>{const aa=amap[x.horizon],st=forecastState(x,aa),price=x.predicted_price??x.model_price,focus=x.focus_zone||x.tight_model_zone||[price,price],risk=x.risk_zone||x.tight_model_zone||focus;return `<div class="card pred-card"><div class="projection-status"><div class="label">${x.horizon}</div><span class="pass-pill ${st.cls}">${st.label}</span></div><div class="price">${money(price)}</div><div class="small">Probability: UP ${pct(x.probability_up)} • DOWN ${pct(x.probability_down)}</div><div class="zone"><div class="label">Focus Zone</div><b>${money(focus?.[0])} – ${money(focus?.[1])}</b><div class="small">Risk Zone: ${money(risk?.[0])} – ${money(risk?.[1])}</div><div class="small">Backtest: ${st.label} • ${x.confidence||'—'} model confidence</div></div></div>`}).join('')}</section>`}

/* V4_SPECIALIST_PANEL_JS */
function v4State(pass){return pass?{label:'PASS',cls:'pass'}:{label:'FAIL',cls:'fail'}}
function fourHourV4(h){if(!h||h.status!=='ok')return `<div class="v4-card hero"><div class="label">Restored 4H Specialist</div><div class="value bad">Unavailable</div></div>`;const r=h.recent_28||{},st=h.stable_96||{},rs=v4State(r.pass),ss=v4State(st.pass),overall=h.overall_status||'FAIL',oc=overall==='PASS'?'pass':overall.includes('RECENT')?'fail':'fail';return `<div class="v4-card hero"><div class="projection-status"><div class="label">Restored 4H Specialist</div><span class="pass-pill ${oc}">${overall}</span></div><div class="price">${money(h.predicted_price)}</div><div class="small">UP ${pct(h.probability_up)} • DOWN ${pct(h.probability_down)}</div><table class="v4-table"><tr><td>Earlier 28-origin test</td><td><span class="pass-pill ${rs.cls}">${rs.label}</span></td></tr><tr><td>28-origin accuracy / edge</td><td>${pct(r.directional_accuracy)} / ${pct(r.directional_edge)}</td></tr><tr><td>28-origin MAE skill</td><td>${pct(r.mae_skill_vs_baseline)}</td></tr><tr><td>Long 96-origin stability</td><td><span class="pass-pill ${ss.cls}">${ss.label}</span></td></tr><tr><td>96-origin accuracy / edge</td><td>${pct(st.directional_accuracy)} / ${pct(st.directional_edge)}</td></tr><tr><td>96-origin MAE skill</td><td>${pct(st.mae_skill_vs_baseline)}</td></tr></table><div class="small">The earlier 4H timeframe is restored, but the longer stability test remains visible so recent strength is not confused with long-run robustness.</div></div>`}
function horizonV4(row){if(!row)return `<div class="v4-card"><div class="value bad">Unavailable</div></div>`;const c=row.challenger||{},st=v4State(!!c.v4_pass);return `<div class="v4-card"><div class="projection-status"><div class="label">V4 ${row.horizon} Specialist</div><span class="pass-pill ${st.cls}">${st.label}</span></div><div class="price">${money(c.predicted_price)}</div><div class="small">UP ${pct(c.probability_up)} • ${row.selected_as_champion?'PROMOTED':'not promoted'}</div><table class="v4-table"><tr><td>Directional accuracy</td><td>${pct(c.backtest_directional_accuracy)}</td></tr><tr><td>Edge vs baseline</td><td>${pct(c.directional_edge)}</td></tr><tr><td>MAE skill</td><td>${pct(c.mae_skill_vs_baseline)}</td></tr><tr><td>OOS tests</td><td>${c.walkforward_origins||'—'}</td></tr></table></div>`}
function macroV4(m){const c=m?.macro_forecast||{},prom=!!m?.selected_as_champion;return `<div class="v4-card"><div class="projection-status"><div class="label">1Y Macro Challenger</div><span class="pass-pill ${prom?'pass':'fail'}">${prom?'PROMOTED':'FAIL'}</span></div><div class="price">${money(c.predicted_price??c.model_price)}</div><div class="small">UP ${pct(c.probability_up)} • ${c.confidence||'—'} confidence</div><table class="v4-table"><tr><td>Directional accuracy</td><td>${pct(c.backtest_directional_accuracy)}</td></tr><tr><td>Edge</td><td>${pct(c.directional_edge)}</td></tr><tr><td>MAE skill</td><td>${pct(c.mae_skill_vs_baseline)}</td></tr></table></div>`}
function meaningfulV4(mp){const rows=mp?.horizons||[];return `<div class="card" style="margin-bottom:12px"><div class="chart-title">V4 Meaningful-Move Probability</div><div class="small">UP/DOWN require a volatility-adjusted meaningful move; otherwise the model can say NO EDGE.</div><div class="v4-probs">${rows.map(x=>`<div class="v4-prob"><b>${x.horizon_days}D • ${x.signal||'NO EDGE'}</b><div>DOWN ${pct(x.probability_down)}</div><div>NO EDGE ${pct(x.probability_no_edge)}</div><div>UP ${pct(x.probability_up)}</div><div class="${x.pass?'good':'bad'}">${x.pass?'PASS':'FAIL'}</div></div>`).join('')||'<div class="small">V4 probability data unavailable.</div>'}</div></div>`}

function frameworks(f){if(!f)return '';const e=f.elliott,w=f.wyckoff,re=f.fib.retr,ex=f.fib.ext,waves=(e.waves||[]).map(x=>`<span class="wave">${x.label}: ${money(x.price)}</span>`).join('');return `<div class="section-title">Structure Frameworks <span class="section-kicker">Elliott-style • Wyckoff-style • Fibonacci</span></div><section class="framework-grid"><div class="framework-card"><div class="label">Elliott-style swing map</div><div class="big ${toneText(e.bias)}">${e.phase}</div><div class="small">${e.confidence} confidence</div><div class="wave-list">${waves||'<span class="small">Not enough clean swings.</span>'}</div><p>Provisional swing interpretation. A new pivot can change the count.</p></div><div class="framework-card"><div class="label">Wyckoff-style phase</div><div class="big ${toneText(w.bias)}">${w.phase}</div><div class="small">${w.confidence} confidence • range ${money(w.low)} – ${money(w.high)}</div><p>${w.evidence.join(' ')}</p></div><div class="framework-card"><div class="label">Fibonacci map</div><div class="big">${f.fib.direction}</div><div class="small">Swing ${money(f.fib.low)} → ${money(f.fib.high)}</div><table class="technical-table"><tr><td>38.2%</td><td>${money(re['38.2'])}</td></tr><tr><td>50.0%</td><td>${money(re['50.0'])}</td></tr><tr><td>61.8%</td><td>${money(re['61.8'])}</td></tr><tr><td>127.2% ext.</td><td>${money(ex['127.2'])}</td></tr><tr><td>161.8% ext.</td><td>${money(ex['161.8'])}</td></tr></table></div></section>`}
function projections(p,auditAsset){const auditMap=Object.fromEntries((auditAsset?.price_projections||[]).map(x=>[x.horizon,x]));return `<div class="section-title">Projection Diagnostics</div><section class="projections">${(p.projections||[]).map(x=>{const a=auditMap[x.horizon],st=forecastState(x,a),focus=x.focus_zone||x.tight_model_zone,risk=x.risk_zone||x.tight_model_zone;return `<div class="card projection"><div class="projection-status"><div class="label">${x.horizon}</div><span class="pass-pill ${st.cls}">${st.label}</span></div><div class="price">${money(x.predicted_price??x.model_price)}</div><div class="small">UP ${pct(x.probability_up)} • DOWN ${pct(x.probability_down)} • model agreement ${pct(x.model_agreement)}</div><div class="zone"><b>Focus ${money(focus?.[0])} – ${money(focus?.[1])}</b><div class="small">Risk ${money(risk?.[0])} – ${money(risk?.[1])}</div><div class="small">Direction ${pct(x.backtest_directional_accuracy)} • edge ${pct(x.directional_edge)} • price-error skill ${pct(x.mae_skill_vs_baseline)} • ${x.walkforward_origins||'—'} tests</div></div></div>`}).join('')}</section><div class="note">${p.note||''}</div>`}
function tech(t){const i=t.indicators||{},z=t.technical_path_zones||{},c=t.confirmation||{},pv=t.pivots||{};return `<div class="section-title">Full Technical Analysis</div><section class="two"><div class="card"><div class="chart-head"><div><div class="chart-title">Price Structure + Trend</div><div class="small">Recent daily futures structure</div></div><div class="badge">${t.market_structure||'—'}</div></div><canvas id="priceChart" height="110"></canvas></div><div class="card"><div class="label">Technical Confluence Score</div><div class="tech-score ${toneText(t.technical_bias)}">${t.technical_score??'—'}/100</div><div class="value ${toneText(t.technical_bias)}" style="font-size:19px">${t.technical_bias||'—'}</div><div class="tech-grid"><div class="pill"><div class="label">RSI 14</div><div class="v">${i.rsi14??'—'}</div></div><div class="pill"><div class="label">MACD Hist</div><div class="v">${i.macd_hist??'—'}</div></div><div class="pill"><div class="label">ADX 14</div><div class="v">${i.adx14??'—'}</div></div><div class="pill"><div class="label">Stochastic</div><div class="v">${i.stoch_k??'—'} / ${i.stoch_d??'—'}</div></div></div><div class="zone"><b>1–3D path ${money(z['1_3d']?.[0])} – ${money(z['1_3d']?.[1])}</b><b>5–10D path ${money(z['5_10d']?.[0])} – ${money(z['5_10d']?.[1])}</b></div></div></section><section class="two"><div class="card"><div class="chart-title">Confirmation Levels</div><div class="levels"><div class="pill"><div class="label">Bullish confirmation</div><div class="v good">Above ${money(c.bullish_above)}</div></div><div class="pill"><div class="label">Bearish confirmation</div><div class="v bad">Below ${money(c.bearish_below)}</div></div><div class="pill"><div class="label">Pivot / R1</div><div class="v">${money(pv.pivot)} / ${money(pv.r1)}</div></div><div class="pill"><div class="label">Pivot / S1</div><div class="v">${money(pv.pivot)} / ${money(pv.s1)}</div></div></div></div><div class="card"><div class="chart-title">Signal Stack</div><div class="signals">${(t.signals||[]).map(s=>`<div class="signal"><b>${s.name}: <span class="${toneText(s.state)}">${s.state}</span></b><div>${s.detail}</div></div>`).join('')}</div></div></section>`}
function researchDesk(t,f){const i=t.indicators||{},mt=t.multi_timeframe||{},vf=t.volume_flow||{},patterns=(f?.patterns||t.chart_patterns||[]).map(x=>`<div class="pattern-card"><b class="${toneText(x.bias)}">${x.name}</b><div class="small">${x.bias||'Neutral'} • ${x.confidence||'—'} confidence</div><p>${x.meaning||''}</p></div>`).join(''),candles=(t.candlestick_patterns||[]).map(x=>`<div class="pattern-card"><b class="${toneText(x.bias)}">${x.name}</b><div class="small">${x.bias||'Neutral'}</div><p>${x.meaning||''}</p></div>`).join(''),tf=['4H','1D','1W'].map(k=>{const x=mt[k]||{};return `<div class="tf-card"><div class="label">${k}</div><div class="tf-trend ${toneText(x.trend)}">${x.trend||'Unavailable'}</div><div class="small">RSI ${x.rsi14??'—'} • MACD ${x.macd_bias||'—'} • ADX ${x.adx14??'—'}</div><div class="small">EMA20 ${money(x.ema20)} • EMA50 ${money(x.ema50)}</div></div>`}).join('');return `<div class="section-title">Research Desk Technicals <span class="section-kicker">full detail underneath the simple summary</span></div><div class="card" style="margin-bottom:12px"><div class="chart-title">Multi-Timeframe Trend</div><div class="tf-grid">${tf}</div></div><section class="desk-grid"><div class="desk-card"><div class="chart-title">Momentum</div><table class="technical-table"><tr><td>RSI 14</td><td>${i.rsi14??'—'}</td></tr><tr><td>MACD</td><td>${i.macd??'—'}</td></tr><tr><td>MACD Signal</td><td>${i.macd_signal??'—'}</td></tr><tr><td>MACD Histogram</td><td>${i.macd_hist??'—'}</td></tr><tr><td>Stochastic K / D</td><td>${i.stoch_k??'—'} / ${i.stoch_d??'—'}</td></tr><tr><td>ADX</td><td>${i.adx14??'—'}</td></tr><tr><td>+DI / -DI</td><td>${i.plus_di??'—'} / ${i.minus_di??'—'}</td></tr></table></div><div class="desk-card"><div class="chart-title">Trend Averages</div><table class="technical-table"><tr><td>EMA 9</td><td>${money(i.ema9)}</td></tr><tr><td>EMA 20</td><td>${money(i.ema20)}</td></tr><tr><td>EMA 50</td><td>${money(i.ema50)}</td></tr><tr><td>EMA 200</td><td>${money(i.ema200)}</td></tr><tr><td>SMA 20</td><td>${money(i.sma20)}</td></tr><tr><td>SMA 50</td><td>${money(i.sma50)}</td></tr><tr><td>SMA 200</td><td>${money(i.sma200)}</td></tr><tr><td>20D VWAP</td><td>${money(i.rolling_vwap20)}</td></tr></table></div><div class="desk-card"><div class="chart-title">Volatility + Flow</div><table class="technical-table"><tr><td>ATR 14</td><td>${money(i.atr14)}</td></tr><tr><td>ATR %</td><td>${i.atr14_pct??'—'}%</td></tr><tr><td>Realized Vol</td><td>${i.realized_vol20_pct??'—'}%</td></tr><tr><td>Bollinger Width</td><td>${i.bb_width_pct??'—'}%</td></tr><tr><td>Volume vs 20D</td><td>${vf.volume_vs_20d??'—'}x</td></tr><tr><td>OBV Trend</td><td>${vf.obv_trend||'—'}</td></tr><tr><td>Volume POC</td><td>${money(vf.poc)}</td></tr></table></div></section><section class="two"><div class="card"><div class="chart-title">Chart Pattern Scanner</div><div class="pattern-grid">${patterns||'<div class="small">No major chart pattern.</div>'}</div></div><div class="card"><div class="chart-title">Candlestick Scanner</div><div class="pattern-grid">${candles||'<div class="small">No major candle pattern.</div>'}</div></div></section>`}

function drawChart(t,asset){const el=document.getElementById('priceChart');if(!el)return;if(chart){chart.destroy();chart=null}const rows=t.chart||[];if(!rows.length)return;const series=k=>rows.map(x=>Number.isFinite(Number(x[k]))?Number(x[k]):null), close=series('close'), overlay=t.chart_overlay||{};chart=new Chart(el,{type:'line',plugins:[techOverlayPlugin],data:{labels:rows.map(x=>x.date),datasets:[{label:asset==='gold'?'Gold futures':'Silver futures',data:close,borderWidth:2.2,pointRadius:0,borderColor:asset==='gold'?'#d9b55f':'#c8d1db',tension:.08},{label:'EMA20',data:series('ema20'),borderWidth:1.15,pointRadius:0,borderColor:'#72a8ff'},{label:'EMA50',data:series('ema50'),borderWidth:1.05,pointRadius:0,borderColor:'#a786ff'},{label:'EMA200',data:series('ema200'),borderWidth:1,pointRadius:0,borderColor:'#efbe68',borderDash:[6,4]},{label:'VWAP20',data:series('vwap20'),borderWidth:1,pointRadius:0,borderColor:'#5bd39a',borderDash:[3,3]},{label:'BB upper',data:series('bb_upper'),borderWidth:.8,pointRadius:0,borderColor:'rgba(145,164,184,.55)',borderDash:[2,4]},{label:'BB lower',data:series('bb_lower'),borderWidth:.8,pointRadius:0,borderColor:'rgba(145,164,184,.55)',borderDash:[2,4]}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#b8c6d4',boxWidth:12,font:{size:10}}},techOverlay:{levels:overlay.levels||[],patterns:overlay.patterns||[],divergences:overlay.divergences||[],events:overlay.events||[]}},scales:{x:{ticks:{color:'#71859b',maxTicksLimit:9},grid:{display:false}},y:{ticks:{color:'#71859b'},grid:{color:'rgba(120,145,170,.08)'}}}}});const card=el.parentElement;let box=card.querySelector('.overlay-legend');if(box)box.remove();el.insertAdjacentHTML('afterend',overlayPatternLegend(t))}
async function loadAsset(asset){const map=asset==='gold'?{f:'data/live_forecast.json',t:'data/gold_technicals.json',p:'data/gold_projections.json',r:'data/gold_regime_intraday.json',h4:'data/gold_4h_specialist.json',hs:'data/gold_horizon_specialist_v4.json',mp:'data/gold_meaningful_probability_v4.json',macro:'data/gold_macro_1y.json'}:{f:'data/silver_forecast.json',t:'data/silver_technicals.json',p:'data/silver_projections.json',r:'data/silver_regime_intraday.json',h4:'data/silver_4h_specialist.json',hs:'data/silver_horizon_specialist_v4.json',mp:'data/silver_meaningful_probability_v4.json',macro:'data/silver_macro_1y.json'},bust='?ts='+Date.now();const safe=u=>fetch(u+bust,{cache:'no-store'}).then(x=>x.ok?x.json():null).catch(()=>null);const [d,t,p,audit,r,h4,hs,mp,macro]=await Promise.all([safe(map.f),safe(map.t),safe(map.p),safe('data/model_backtest.json'),safe(map.r),safe(map.h4),safe(map.hs),safe(map.mp),safe(map.macro)]),aa=audit?.assets?.[asset]||null,f=technicalFrameworks(t||{});$('#updated').textContent='Updated '+new Date(p?.updated_utc||d?.updated_utc||Date.now()).toLocaleString();$('#app').innerHTML=simpleGuru(d||{},t||{},p||{projections:[]},aa,r)+predictionSnapshot(p||{projections:[]},aa)+hardNumbersPanel(d||{},t||{},p||{projections:[]},aa,h4,hs,mp,macro)+v4Panel(h4,hs,mp,macro)+regimePanel(r)+tradingViewSection(asset)+supportResistance(t||{},f)+frameworks(f)+projections(p||{projections:[]},aa)+tech(t||{})+researchDesk(t||{},f)+stats(d||{})+factors(d||{});mountTradingView(asset);drawChart(t||{},asset)}
function auditCheat(){return `<div class="card" style="margin-bottom:12px"><div class="chart-title">Audit Cheat Sheet</div><div class="cheat-grid"><div class="cheat-item"><b>PASS</b><span>This historical test beat its simple baseline.</span></div><div class="cheat-item"><b>Directional Edge</b><span>Positive means UP/DOWN calls improved versus baseline.</span></div><div class="cheat-item"><b>MAE Skill</b><span>Positive means predicted price was closer than baseline.</span></div><div class="cheat-item"><b>ML Trust</b><span>How much of the raw ML move is kept after calibration.</span></div><div class="cheat-item"><b>Focus Zone</b><span>Narrower area around the point forecast.</span></div><div class="cheat-item"><b>Risk Zone</b><span>Wider uncertainty area; not a target.</span></div></div></div>`}
function auditAsset(name,a){if(!a)return `<div class="card"><div class="value">Audit unavailable</div></div>`;const pp=(a.price_projections||[]).map(x=>`<tr><td>${x.horizon}</td><td>${pct(x.directional_accuracy)}</td><td>${pct(x.baseline_directional_accuracy)}</td><td class="${x.directional_edge>0?'good':'bad'}">${pct(x.directional_edge)}</td><td class="${x.mae_skill_vs_baseline>0?'good':'bad'}">${pct(x.mae_skill_vs_baseline)}</td><td>${x.walkforward_origins}</td><td><span class="pass-pill ${x.pass?'pass':'fail'}">${x.pass?'PASS':'FAIL'}</span></td></tr>`).join('');return `<div class="card"><div class="label">${name} Model Audit</div><div class="value">${a.audit_grade}</div><div class="small">Component pass rate: ${pct(a.component_pass_rate)}</div><table class="audit-table"><thead><tr><th>Horizon</th><th>Dir Acc.</th><th>Baseline</th><th>Edge</th><th>MAE Skill</th><th>Tests</th><th>Status</th></tr></thead><tbody>${pp}</tbody></table></div>`}
async function loadAudit(){if(chart){chart.destroy();chart=null}const d=await fetch('data/model_backtest.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());$('#updated').textContent='Audit updated '+new Date(d.updated_utc).toLocaleString();$('#app').innerHTML=`<div class="section-title">Model Audit</div>${auditCheat()}<div class="card" style="margin-bottom:12px"><div class="chart-title">Validation Method</div><p class="note">${d.validation_method}</p><p class="note">Every forecast is backtested. PASS means it cleared the strict baseline, error, and sample-size rules. FAIL means it did not. Probability is still shown, but FAIL does not receive predictive trust.</p></div><section class="audit-grid">${auditAsset('Gold',d.assets?.gold)}${auditAsset('Silver',d.assets?.silver)}</section>`}
async function render(){try{if(active==='audit')await loadAudit();else await loadAsset(active)}catch(e){$('#app').innerHTML=`<div class="card"><div class="value bad">Could not load this view</div><div class="small">${e.message}</div></div>`}}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.view;render()}));const initialSymbol=new URLSearchParams(location.search).get('tvwidgetsymbol');if(initialSymbol==='OANDA:XAGUSD')active='silver';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===active));render();setInterval(()=>{if(document.visibilityState==='visible')render()},5*60*1000);
</script></body></html>
