<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>Metals Intelligence · Gold & Silver</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#121b27;--line:#293647;--text:#edf2f8;--muted:#9eafc3;--gold:#ecc777;--green:#6ed4b8;--red:#f18c94}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}header{border-bottom:1px solid var(--line);padding:24px max(20px,calc((100vw - 1400px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:20px;font-weight:750;letter-spacing:-.5px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--gold);margin-bottom:5px}main{max-width:1440px;margin:auto;padding:24px 20px 60px}.muted,small{color:var(--muted)}.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap}button{background:#182333;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:8px 14px}button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#151b24;font-weight:700}.asset-tabs button{min-width:100px}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:24px 0}.price{font-size:44px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-1.5px}.symbol{font-size:12px;color:var(--muted);margin-top:7px}.badge{display:inline-block;padding:4px 9px;border:1px solid var(--line);border-radius:4px;font-size:11px;font-weight:750;letter-spacing:.7px;background:#202b39}.badge.wait{color:var(--gold)}.badge.up{color:var(--green)}.badge.down{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}h1,h2,h3,p{margin-top:0}h1{font-size:20px;margin-bottom:5px}h2{font-size:16px;letter-spacing:-.2px;margin-bottom:16px}h3{font-size:13px;margin-bottom:8px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.panel-head h2{margin:0}.setup-state{font-size:28px;font-weight:750;margin:18px 0 4px;color:var(--gold)}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}.metric strong{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}.metric.wide{grid-column:1/-1}.reasons{padding-left:18px;color:var(--muted);font-size:12px;margin-bottom:0}.reasons li{margin:6px 0}.forecast-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.forecast{padding:16px;background:#0e1722;border:1px solid var(--line);border-radius:7px}.forecast h3{font-size:14px}.forecast .headline{font-size:21px;font-weight:700;margin:10px 0}.forecast small{font-size:11px}details{margin-top:14px}summary{cursor:pointer;color:var(--gold);font-size:12px}details p{font-size:12px;color:var(--muted);margin:10px 0}.chart-wrap{height:370px;position:relative}canvas{width:100%;height:100%;display:block}.chart-tip{position:absolute;top:8px;left:8px;background:#0b1018e8;color:var(--text);font-size:11px;pointer-events:none;padding:6px;border-radius:3px;display:none}.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin:12px 0;flex-wrap:wrap}.legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:5px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}th{text-align:left;color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.6px}td,th{padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}td:first-child,th:first-child{padding-left:0}tr:last-child td{border-bottom:0}.uptext{color:var(--green)}.downtext{color:var(--red)}.event-list{max-height:290px;overflow:auto}.event{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.event:last-child{border:0}.event strong{font-weight:600}.event small{display:block;font-size:10px;margin-top:3px}.context-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.context-item{border-bottom:1px solid var(--line);padding:10px 0}.context-item strong{display:block;font-size:20px;margin:6px 0}.context-item small{font-size:10px}.notice{padding:12px 15px;margin-bottom:16px;border-left:3px solid var(--gold);background:#29261d;color:#e7d9b7;font-size:12px}.error{color:var(--red);white-space:pre-wrap}.footnote{font-size:11px;color:var(--muted);margin-bottom:0}footer{margin-top:24px;color:var(--muted);font-size:11px;display:flex;gap:20px;flex-wrap:wrap}a{color:var(--gold)}.loading{padding:70px 0;color:var(--muted)}.scorebar{height:5px;border-radius:3px;background:#293647;margin:12px 0}.scorebar span{display:block;height:5px;background:var(--gold);border-radius:3px}.hidden{display:none}
@media(max-width:1000px){.span4,.span8{grid-column:span 12}.forecast-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-wrap{height:330px}}@media(max-width:650px){header{align-items:flex-start;padding:20px}.brand{font-size:17px}header .muted{font-size:10px}.span6{grid-column:span 12}.panel{padding:15px}.topline{align-items:flex-start;flex-direction:column}.price{font-size:36px}.context-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-head{align-items:flex-start;flex-direction:column}.controls button{padding:6px 10px}.forecast-grid{gap:8px}.forecast{padding:12px}.chart-wrap{height:290px}main{padding:20px 12px 40px}}
</style></head><body>
<header><div><div class="eyebrow">Independent market research</div><div class="brand">METALS / INTELLIGENCE</div></div><div class="muted" id="snapshot-time">Loading snapshot…</div></header>
<main><nav class="tabs asset-tabs" aria-label="Asset"><button id="gold-tab" data-asset="gold" aria-pressed="true">Gold</button><button id="silver-tab" data-asset="silver" aria-pressed="false">Silver</button></nav>
<div id="loading" class="loading" role="status">Loading the latest coherent market snapshot…</div><div id="app" class="hidden" data-asset="gold"></div>
<footer><a href="https://github.com/samin110597-create/Gold-Price-Prediction-LSTM">Code & methodology</a><a href="https://github.com/samin110597-create/Gold-Price-Prediction-LSTM/blob/master/VALIDATION_BASELINE.md">Frozen validation baseline</a><a href="data/run_manifest.json">Snapshot manifest</a><span>Futures prices in USD per troy ounce · Research only</span></footer>
</main>
<script>
'use strict';
let data,asset='gold',mode='Strict',tf='1d';
const $=s=>document.querySelector(s);
const escape=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=(x,d=2)=>Number.isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const pct=x=>Number.isFinite(x)?n(x*100,1)+'%':'—';
const pp=x=>Number.isFinite(x)?(x>0?'+':'')+n(x*100,1)+' pp':'—';
const time=x=>x?new Date(x).toLocaleString('en-GB',{timeZone:'UTC',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})+' UTC':'—';
const direction=d=>d>0?'Bullish':d<0?'Bearish':'Neutral';
const badge=(text,kind='wait')=>'<span class="badge '+kind+'">'+escape(text)+'</span>';
function render(){
const a=data.assets[asset],s=a.setups[mode],detail=a.timeframes[tf],e=detail.evidence;
$('#app').classList.remove('hidden');$('#app').dataset.asset=asset;$('#app').dataset.runId=data.run_id;
$('#snapshot-time').textContent='Snapshot · '+time(data.asof);
document.querySelectorAll('[data-asset]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.dataset.asset===asset)});
const levels=detail.structure.levels;
const fcards=Object.entries(a.forecasts).map(([h,f])=>{const v=f.primary,r=f.research,m=f.oos,ho=f.holdout;return '<article class="forecast"><div class="panel-head"><h3>'+h+'</h3>'+badge(f.status,f.status==='VALIDATED'?'up':'wait')+'</div><div class="headline">'+(v?'$'+n(v.price):'No validated edge')+'</div><small>'+(v?'80% interval $'+n(v.interval80[0])+' – $'+n(v.interval80[1]):'Primary expected price withheld')+'</small><details><summary>Evidence & research estimate</summary><p>Research estimate '+(r?'$'+n(r.price)+' · P(up) '+pct(r.probability_up):'unavailable')+'. '+(r?'Reference $'+n(r.reference_price)+' at '+time(r.origin)+'.':'')+'</p><p>OOS '+(m.n||0)+' origins · hit '+pct(m.directional_accuracy)+' · baseline '+pct(m.baseline_accuracy)+' · edge '+pp(m.edge)+'<br>MAE skill '+pct(m.mae_skill)+' · Brier skill '+pct(m.brier_skill)+'<br>Holdout '+(ho.n||0)+' · edge '+pp(ho.edge)+' · interval coverage '+pct(ho.coverage80)+'</p><p>Failed gates: '+escape(f.failed_gates.join(', ')||'none')+'</p><a href="'+escape(f.evidence_file)+'">Full timestamped evaluation</a></details></article>'}).join('');
const indicators=['rsi','adx','plus_di','minus_di','macd','macd_signal','macd_hist','atr','stoch_k','stoch_d','mfi','cmf','relative_volume','rolling_vwap20','ema9','ema20','ema50','ema100','ema200','sma50','sma200','bb_upper','bb_lower','donchian_high','donchian_low'];
$('#app').innerHTML=
'<div class="topline"><div><div class="eyebrow">'+a.name+' / '+a.symbol+'</div><div class="price" data-testid="price">$'+n(a.quote.price)+'</div><div class="symbol">'+escape(a.quote.basis)+' · '+time(a.quote.time)+'</div></div><div>'+badge(a.fresh?'LATEST COMPLETED BARS':'DATA GAP / WAIT',a.fresh?'up':'wait')+'<div class="symbol">Quote and completed-bar analysis have separate timestamps</div></div></div>'+
(!a.fresh?'<div class="notice">At least one timeframe is missing its latest expected completed bar. Setup execution is paused. Inspect the matrix for the affected timeframe.</div>':'')+
'<div class="grid"><section class="panel span4"><div class="panel-head"><h2>Decision map</h2><div class="controls"><button data-mode="Strict" aria-pressed="'+(mode==='Strict')+'">Strict</button><button data-mode="Adaptive" aria-pressed="'+(mode==='Adaptive')+'">Adaptive</button></div></div><div class="setup-state" data-testid="setup-state">'+escape(s.action)+'</div><div class="muted">'+direction(s.direction)+' structure · '+escape(mode)+' criteria</div><div class="metrics"><div class="metric wide"><span>Conditional entry zone</span><strong>'+(s.entry_zone?'$'+n(s.entry_zone[0])+' – $'+n(s.entry_zone[1]):'Unavailable')+'</strong></div><div class="metric"><span>Fixed invalidation</span><strong>'+n(s.stop)+'</strong></div><div class="metric"><span>Target-before-stop probability</span><strong>Unvalidated</strong></div><div class="metric wide"><span>Observed swing objectives / reward : risk</span><strong>'+(s.targets.length?s.targets.map((t,i)=>n(t)+' / '+n(s.risk_reward[i])+'R').join(' · '):'Unavailable')+'</strong></div></div><p class="footnote">'+escape(s.trigger||'No confirmed structural entry map')+'</p><ul class="reasons">'+s.reasons.map(r=>'<li>'+escape(r)+'</li>').join('')+'</ul>'+(s.issued_at?'<p class="footnote" style="margin-top:14px">Levels frozen '+time(s.issued_at)+' · '+escape(s.id)+'</p>':'')+'</section>'+
'<section class="panel span8"><div class="panel-head"><h2>Price & confirmed structure</h2><div class="controls" aria-label="Chart timeframe">'+['15m','1h','4h','1d','1w'].map(t=>'<button data-tf="'+t+'" aria-pressed="'+(tf===t)+'">'+t.toUpperCase()+'</button>').join('')+'</div></div><div class="chart-wrap"><canvas id="chart" role="img" aria-label="'+a.name+' '+tf+' completed candlestick chart"></canvas><div id="chart-tip" class="chart-tip"></div></div><div class="legend"><span><i style="background:#ecc777"></i>EMA20</span><span><i style="background:#97acde"></i>EMA50</span><span><i style="background:#445573"></i>Bollinger bands</span><span>Triangles: confirmed major BOS / CHoCH</span></div><p class="footnote">Last completed '+time(detail.last_completed)+'. Structure signals appear on confirmation bars. OHLCV bars are from continuous futures.</p></section>'+
'<section class="panel span12"><div class="panel-head"><h2>Expected price · validation first</h2><span class="muted">4H = 4 trading hourly bars · 1D / 1W / 1M = 1 / 5 / 21 sessions</span></div><div class="forecast-grid">'+fcards+'</div></section>'+
'<section class="panel span8"><h2>Multi-timeframe matrix</h2><div class="table-wrap"><table><thead><tr><th>Frame</th><th>Structure</th><th>Regime</th><th>Evidence</th><th>RSI</th><th>ADX</th><th>Completed</th><th>Fresh</th></tr></thead><tbody>'+Object.entries(a.timeframes).map(([t,d])=>'<tr><td>'+t.toUpperCase()+'</td><td class="'+(d.structure.direction>0?'uptext':d.structure.direction<0?'downtext':'')+'">'+direction(d.structure.direction)+'</td><td>'+d.evidence.regime+'</td><td>'+n(d.evidence.score,0)+'/100</td><td>'+n(d.indicators.rsi,1)+'</td><td>'+n(d.indicators.adx,1)+'</td><td>'+time(d.last_completed)+'</td><td>'+ (d.quality.latest_expected_bar_present?'YES':'GAP')+'</td></tr>').join('')+'</tbody></table></div><p class="footnote">Confluence is capped across trend/structure, momentum and flow. It is not a calibrated probability. Overbought or oversold does not establish a reversal.</p></section>'+
'<section class="panel span4"><h2>'+tf.toUpperCase()+' evidence</h2><div class="price" style="font-size:32px">'+n(e.score,0)+'<small style="font-size:16px"> / 100</small></div><div class="scorebar"><span style="width:'+e.score+'%"></span></div><p class="muted">'+escape(e.regime)+' · '+escape(e.volatility)+' volatility · '+escape(e.extension)+'</p><div class="table-wrap"><table>'+Object.entries(e.votes).map(([k,v])=>'<tr><td>'+escape(k.replaceAll('_',' '))+'</td><td>'+direction(v)+'</td></tr>').join('')+'</table></div></section>'+
'<section class="panel span6"><h2>Structure & reversal timeline · '+tf.toUpperCase()+'</h2><div class="event-list">'+detail.structure.events.slice(-16).reverse().map(ev=>'<div class="event"><strong class="'+(ev.direction>0?'uptext':'downtext')+'">'+escape(ev.kind.replaceAll('_',' '))+'</strong> · '+escape(ev.scope)+'<small>'+time(ev.time)+(ev.level?' · level '+n(ev.level):'')+'</small>'+(ev.note?'<small>'+escape(ev.note)+'</small>':'')+'</div>').join('')+'</div><p class="footnote" style="margin-top:12px">Sweep → CHoCH → higher low / lower high → BOS. A wick alone is a watch. “Absorption” and “distribution” are OHLCV proxies.</p></section>'+
'<section class="panel span6"><h2>Known levels · '+tf.toUpperCase()+'</h2><div class="table-wrap"><table><thead><tr><th>Role</th><th>Zone</th><th>Structural quality</th></tr></thead><tbody>'+levels.map(l=>'<tr><td>'+l.role+'</td><td>'+n(l.zone[0])+' – '+n(l.zone[1])+'</td><td>'+n(l.quality,0)+'/100</td></tr>').join('')+'</tbody></table></div><details><summary>Patterns & Fibonacci context</summary>'+detail.context.patterns.map(p=>'<p>'+escape(p.name)+' · '+escape(p.state)+' · neckline '+n(p.neckline)+' · objective '+n(p.objective)+'<br>'+escape(p.basis)+'</p>').join('')+'<p>'+detail.context.fibonacci.map(v=>pct(v.ratio)+': '+n(v.price)).join(' · ')+'</p><p>'+escape(detail.context.elliott)+'<br>'+escape(detail.context.wyckoff)+'</p></details></section>'+
'<section class="panel span6"><h2>Session & forward record</h2><div class="metrics"><div class="metric"><span>Session</span><strong>'+escape(a.session.status)+'</strong></div><div class="metric"><span>Session VWAP approximation</span><strong>'+n(a.session.session_vwap)+'</strong></div><div class="metric"><span>Completed session range</span><strong>'+n(a.session.low)+' – '+n(a.session.high)+'</strong></div><div class="metric"><span>Initial 4H range</span><strong>'+n(a.session.initial_four_hour_low)+' – '+n(a.session.initial_four_hour_high)+'</strong></div><div class="metric"><span>Corrected forward records</span><strong>'+a.forward.resolved+' resolved / '+a.forward.issued+' issued</strong></div><div class="metric"><span>Forward direction accuracy</span><strong>'+pct(a.forward.directional_accuracy)+'</strong></div></div><p class="footnote">'+escape(a.session.vwap_note||'Exchange session closed; no current-session VWAP')+' Initial balance appears only after all four bars close. Legacy forward scores remain separate.</p></section>'+
'<section class="panel span6"><h2>Indicator detail · '+tf.toUpperCase()+'</h2><div class="table-wrap" style="max-height:320px;overflow:auto"><table><tbody>'+indicators.map(k=>'<tr><td>'+escape(k.replaceAll('_',' '))+'</td><td>'+n(detail.indicators[k],k==='cmf'?3:2)+'</td></tr>').join('')+'</tbody></table></div><p class="footnote">Rolling VWAP20 is a 20-bar volume-weighted typical price. Volume statistics remain unavailable when source volume is missing.</p></section>'+
'<section class="panel span12"><h2>Cross-market context</h2><div class="context-grid">'+Object.entries(data.context).map(([k,v])=>'<div class="context-item"><span class="muted">'+escape(k.replaceAll('_',' '))+'</span><strong>'+n(v.value)+'</strong><small>'+escape(v.status)+' · '+time(v.source_time)+'</small></div>').join('')+'</div><p class="footnote" style="margin-top:15px">Daily external prices use a conservative 24-hour delay and are context only. No corrected, vintage-safe 1Y forecast or verified release calendar is available.</p></section>'+
'<section class="panel span12"><details><summary>Data quality & reproducibility</summary><div class="table-wrap"><table><thead><tr><th>Frame</th><th>Missing expected</th><th>Bad OHLC</th><th>Duplicates</th><th>Forming excluded</th><th>Incomplete groups</th></tr></thead><tbody>'+Object.entries(a.timeframes).map(([t,d])=>'<tr><td>'+t+'</td>'+['missing_expected_bars','invalid_ohlc','duplicates','forming_bars_excluded','incomplete_groups_rejected'].map(k=>'<td>'+n(d.quality[k],0)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p>'+data.limitations.map(escape).join('<br>')+'</p><p>Run '+escape(data.run_id)+'<br>Code '+escape(data.commit)+'<br>Source hash '+escape(data.source_hash)+'</p></details></section></div>';
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{tf=b.dataset.tf;render()});
draw();
}
function draw(){
if(!data)return;
const canvas=$('#chart');if(!canvas)return;
const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
const w=rect.width,h=rect.height,pad={l:8,r:65,t:15,b:26},bars=data.assets[asset].timeframes[tf].chart;
if(!bars.length)return;
let low=Math.min(...bars.map(b=>b.low)),high=Math.max(...bars.map(b=>b.high)),space=(high-low)*.08||1;low-=space;high+=space;
const dx=(w-pad.l-pad.r)/bars.length,x=i=>pad.l+(i+.5)*dx,y=v=>pad.t+(high-v)/(high-low)*(h-pad.t-pad.b);
ctx.font='10px system-ui';ctx.fillStyle='#9eafc3';ctx.strokeStyle='#293647';ctx.lineWidth=.6;
for(let j=0;j<=5;j++){let val=low+(high-low)*j/5,yy=y(val);ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillText(n(val),w-pad.r+8,yy+3)}
for(const [key,color] of [['bb_upper','#445573'],['bb_lower','#445573'],['ema20','#ecc777'],['ema50','#97acde']]){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=key.startsWith('bb')?.7:1.2;let started=false;bars.forEach((b,i)=>{if(!Number.isFinite(b[key])){started=false;return}if(!started){ctx.moveTo(x(i),y(b[key]));started=true}else ctx.lineTo(x(i),y(b[key]))});ctx.stroke()}
bars.forEach((b,i)=>{const color=b.close>=b.open?'#6ed4b8':'#f18c94';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x(i),y(b.high));ctx.lineTo(x(i),y(b.low));ctx.stroke();ctx.fillRect(x(i)-Math.max(1,dx*.3),Math.min(y(b.open),y(b.close)),Math.max(1,dx*.6),Math.max(1,Math.abs(y(b.close)-y(b.open))))});
for(const ev of data.assets[asset].timeframes[tf].structure.events){if(ev.scope!=='major'||!['BOS','CHoCH'].includes(ev.kind))continue;const i=bars.findIndex(b=>b.time===ev.time);if(i<0)continue;const yy=ev.direction>0?y(bars[i].low)+9:y(bars[i].high)-9;ctx.fillStyle=ev.direction>0?'#6ed4b8':'#f18c94';ctx.beginPath();ctx.moveTo(x(i),yy-ev.direction*4);ctx.lineTo(x(i)-4,yy+ev.direction*3);ctx.lineTo(x(i)+4,yy+ev.direction*3);ctx.closePath();ctx.fill()}
ctx.fillStyle='#9eafc3';for(let i=0;i<bars.length;i+=Math.max(1,Math.floor(bars.length/4)))ctx.fillText(new Date(bars[i].time).toLocaleDateString('en-GB',{month:'short',day:'2-digit',timeZone:'UTC'}),x(i),h-5);
canvas.onpointermove=ev=>{let i=Math.max(0,Math.min(bars.length-1,Math.floor((ev.clientX-canvas.getBoundingClientRect().left-pad.l)/dx)));const b=bars[i];$('#chart-tip').textContent=time(b.time)+' · O '+n(b.open)+' H '+n(b.high)+' L '+n(b.low)+' C '+n(b.close);$('#chart-tip').style.display='block'};
canvas.onpointerleave=()=>{$('#chart-tip').style.display='none'};
}
document.querySelectorAll('button[data-asset]').forEach(b=>b.onclick=()=>{asset=b.dataset.asset;render()});
window.addEventListener('resize',draw);
fetch('data/dashboard.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Snapshot unavailable ('+r.status+')');return r.json()}).then(d=>{if(d.schema_version!==1||!d.assets.gold||!d.assets.silver)throw Error('Incomplete snapshot');data=d;$('#loading').classList.add('hidden');render();window.__metalsReady=true}).catch(e=>{$('#loading').classList.add('error');$('#loading').textContent='Market snapshot could not be loaded. '+e.message;console.error(e)});
</script></body></html>
