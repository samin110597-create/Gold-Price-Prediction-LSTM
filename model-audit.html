<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metals Model Audit</title><style>body{margin:0;background:#081018;color:#eef4fa;font:14px system-ui}.w{max-width:1100px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{padding:9px 14px;border:1px solid #33465a;border-radius:10px;background:#111c29;color:#dce6ef;cursor:pointer}.tab.on{border-color:#d8b45e;color:#f1d79a}.card{background:#101a25;border:1px solid #253548;border-radius:14px;padding:16px;margin:12px 0}.grade{font-size:34px;font-weight:800}.PASS{color:#5bd39a}.MIXED{color:#f1c76d}.FAIL{color:#ff7b84}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:9px;border-bottom:1px solid #243243}th{color:#91a3b7;font-size:11px;text-transform:uppercase}.yes{color:#5bd39a}.no{color:#ff7b84}.muted{color:#91a3b7}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.row{grid-template-columns:1fr}table{font-size:12px}}</style></head><body><main class="w"><h1>Gold & Silver Model Audit</h1><p class="muted">Walk-forward validation dashboard. A component passes only when it beats a simple out-of-sample baseline; technical signals are tested on roughly the last three years.</p><div class="tabs"><button class="tab on" data-a="gold">Gold</button><button class="tab" data-a="silver">Silver</button></div><div id="app" class="card">Loading audit…</div></main><script>let data,asset='gold';const pct=x=>x==null?'—':(x*100).toFixed(1)+'%';const n=x=>x==null?'—':Number(x).toFixed(3);function render(){const a=data.assets[asset],el=document.getElementById('app');el.innerHTML=`<div class="grade ${a.audit_grade}">${a.audit_grade}</div><div class="muted">Component pass rate: ${pct(a.component_pass_rate)}</div><p>${a.interpretation}</p><div class="row"><div><h3>Probability forecasts</h3><table><tr><th>Horizon</th><th>Accuracy</th><th>Baseline</th><th>Edge</th><th>Pass</th></tr>${a.probability_forecasts.map(x=>`<tr><td>${x.horizon_days}D</td><td>${pct(x.accuracy)}</td><td>${pct(x.baseline)}</td><td>${pct(x.edge)}</td><td class="${x.pass?'yes':'no'}">${x.pass?'PASS':'FAIL'}</td></tr>`).join('')}</table></div><div><h3>Price projections</h3><table><tr><th>Horizon</th><th>Dir. edge</th><th>MAE skill</th><th>Origins</th><th>Pass</th></tr>${a.price_projections.map(x=>`<tr><td>${x.horizon}</td><td>${pct(x.directional_edge)}</td><td>${pct(x.mae_skill_vs_baseline)}</td><td>${x.walkforward_origins??'—'}</td><td class="${x.pass?'yes':'no'}">${x.pass?'PASS':'FAIL'}</td></tr>`).join('')}</table></div></div><h3>Technical confluence</h3><table><tr><th>Horizon</th><th>Signals</th><th>Hit rate</th><th>Baseline</th><th>Edge</th></tr>${a.technical_signals.map(x=>`<tr><td>${x.horizon_days}D</td><td>${x.signals}</td><td>${pct(x.hit_rate)}</td><td>${pct(x.baseline_direction_rate)}</td><td class="${(x.edge??0)>0?'yes':'no'}">${pct(x.edge)}</td></tr>`).join('')}</table><p class="muted">Updated ${new Date(data.updated_utc).toLocaleString()} • ${data.validation_method}</p>`}fetch('data/model_backtest.json?x='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Audit has not been generated yet');return r.json()}).then(d=>{data=d;render()}).catch(e=>document.getElementById('app').innerHTML='<b>'+e.message+'</b><p class="muted">The V2 workflow creates this file automatically.</p>');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{asset=b.dataset.a;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));if(data)render()});</script></body></html>
